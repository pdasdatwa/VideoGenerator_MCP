[project]
name = "reel-mcp"
version = "0.2.0"
description = "Local reel production MCP. The client LLM directs; this server stores, validates, caches, and renders."
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: renders a real video with Remotion and FFmpeg",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
